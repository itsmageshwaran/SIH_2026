version: '3.9'

services:
  antarctic-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antarctic_navigator_ai
    image: antarctic-ai-sih:latest
    ports:
      - "8000:8000"
    volumes:
      # Persist data and model checkpoints across container restarts
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONPATH=/app
      - UVICORN_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: Nginx reverse proxy (uncomment for production)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - antarctic-ai
